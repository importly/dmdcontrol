[project]
name = "dmdcontrol"
version = "0.1.0"
description = "DLPC900 DMD control and camera sync-check tooling."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Prophesee camera (prophesee/README.md); Linux-only because the OpenEB build exists only on the rig
    "evcam; sys_platform == 'linux'",
    "glfw",
    "numpy",
    "pillow",
    "pyopengl",
    "pyusb",
    "pyyaml",
    "rich",
]

[project.optional-dependencies]
analysis = [
    "opencv-python",
]
camera = [
    "dv-processing",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "notebook>=7.6.0",
    "pytest",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
evcam = { path = "prophesee/evcam-lib", editable = true }

[tool.basedpyright]
include = ["dmdcontrol"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.yapf]
based_on_style = "pep8"
column_limit = 100
dedent_closing_brackets = false
split_before_closing_bracket = false
split_before_first_argument = true
split_all_comma_separated_values = true
