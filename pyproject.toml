[project]
name = "dmdcontrol"
version = "0.1.0"
description = "DLPC900 DMD control and camera sync-check tooling."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "glfw",
    "numpy",
    "opencv-python",
    "pillow",
    "pyopengl",
    "pyusb",
    "rich",
]

[project.optional-dependencies]
camera = [
    "dv-processing",
    "pyyaml",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "notebook>=7.6.0",
    "pytest",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.yapf]
based_on_style = "pep8"
column_limit = 100
dedent_closing_brackets = false
split_before_closing_bracket = false
split_before_first_argument = true
split_all_comma_separated_values = true
