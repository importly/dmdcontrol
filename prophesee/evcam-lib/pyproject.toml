[project]
name = "evcam"
version = "0.1.0"
description = "Makes the OpenEB (Prophesee Metavision) build on the rig importable, plus open_camera()"
requires-python = ">=3.13"
dependencies = [
    "h5py",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["evcam.py"]

[tool.hatch.build.targets.wheel.force-include]
"evcam_openeb.pth" = "evcam_openeb.pth"
