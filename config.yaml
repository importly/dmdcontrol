log_level: INFO

Run:
  mode: kernel                       # count: count test pattern | kernel: kernel data collection (data.h5)
  output_root: runs/camera2_master_30hz_blank
  time_max_s: 600                    # render thread safety cap per pass
  Count:
    start: 5
    end: 15                          # A shows count, blank, count, blank, ...
    number_size_px: 300
    cycles: 20                       # count sequence is displayed this many times, then the run ends
    test_b: dot                      # B-side static pattern: dot | checkerboard
    b_dot_x: 960
    b_dot_y: 540
    b_dot_radius: 30
  Kernel:
    dataset_size: 220                # feature maps; dataset_size // batch_size batches, one kernel per batch (full run: 71500)
    batch_size: 110                  # one DMD pass per batch: 8 frames per feature map (880 at 110, ~15 s)
    image_size: 16                   # feature map side before upscaling
    kernel_size: 9
    fm_px: 300                       # feature map side on DMD A
    kernel_px: 168                   # kernel side on DMD B
    gamma: 1.5                       # applied to each normalized sign product before they are combined
    sheet_fraction: 1.0              # share of batches that save contact sheets (full run: 0.1)
    max_attempts: 3                  # a pass that drops frames is redone this many times at most
    kernel_seed: 0                   # same seed = same kernels every run; null = new random kernels each run

Laser:
  control: True                      # on at power_mw for the run, off after; warns and carries on if not connected
  port: /dev/ttyUSB0
  power_mw: 50

Camera:
  ROI: # sensor silicon level; (0,0,1280,720) = full frame
    # kernel mode: start_x 511, start_y 234, width 300, height 300 (DMD centre -> sensor (661, 384),
    # 0.59 sensor px per DMD px from 20261102-170126; 300+168 DMD px conv = ~266 px plus margin)
    # count mode: 0, 0, 1280, 720
    start_x: 511
    start_y: 234
    width: 300
    height: 300
  Trigger:
    rising_edge: True
    falling_edge: False
  Filter:
    enable: False
    background_activity_duration: 2000
  Accumulation:
    window_us: 16000       # accumulation window == DMD exposure_us (master tied these)
    start_time_offset_us: 0
    polarity_mode: positive  # positive (ON events only) | signed (ON +1, OFF -1); signed shows the previous digit's late OFF events as a ghost
  width: 1280
  height: 720
  signal_fraction: 0.4
  normalize_scale_max: 255    # fixed reference for log scaling (master uses 255)
  bias_sensitivity: low
  Biases:             # Prophesee Gen4.1, absolute values; camera default and allowed range in comments
    bias_diff: 80     # 80, 52..100; reference for on/off, leave it
    bias_diff_on: 115 # 115, bias_diff+15..140; higher = fewer ON events
    bias_diff_off: 52 # 52, 25..bias_diff-15; lower = fewer OFF events
    bias_fo: 74       # 74, 45..110; higher = wider bandwidth (90 gave +11% signal, +20% noise, same timing)
    bias_hpf: 0       # 0, 0..120; higher = ignores slow light changes
    bias_refr: 68     # 68, 30..100; higher = shorter dead time after each event (85: no timing change)

DMD:
  A:
    usb_bus: 1
    usb_port: 2
    xrandr_output: DP-4    
  B:
    usb_bus: 1
    usb_port: 9
    xrandr_output: DP-0
  width: 1920
  height: 1080
  offset: [0, 0]
  target_hz: 60
  safe_margin_us: 250.0
  min_exposure_us: 150
  frame_utilization: 1.0
  dual_pixel: False
  exposure_us: 16000
  display_pipeline_vsyncs: 4        # triggers after the leader before the first semantic frame
  paired_startup_leader_vsyncs: 16  # non-semantic blank vsyncs after sequencer start; their triggers are skipped
  # constants
  dark_time_us: 0
  bitplanes: 24
  VID: 0x0451
  PID: 0xC900
  trigger_out:                      # A's TRIG_OUT_2 rising edge -> camera trigger input
    pulse_width_us: 20
    rising_delay_us: 0
