log_level: INFO

Run:
  output_root: runs/camera2_master_30hz_blank
  count_start: 5
  count_end: 15                      # A shows count, blank, count, blank, ...
  number_size_px: 300
  test_b: dot                        # B-side static pattern: dot | checkerboard
  b_dot_x: 960
  b_dot_y: 540
  b_dot_radius: 30
  cycles: 20                        # count sequence is displayed this many times, then the run ends
  save_filtered_events: True
  save_jpg: False
  time_max_s: 600

Camera:
  ROI: # sensor silicon level; (0,0,1280,720) = full frame
    start_x: 0
    start_y: 0
    width: 1280
    height: 720
  Trigger:
    rising_edge: True
    falling_edge: False
  Filter:
    enable: False
    background_activity_duration: 2000
  Accumulation:
    window_us: 16000       # accumulation window == DMD exposure_us (master tied these)
    start_time_offset_us: 0
    polarity_mode: signed  # positive (ON events only) | signed (+1/-1) | ignore (all +1)
  width: 1280
  height: 720
  Writer:
    enable: True
  signal_fraction: 0.4
  normalize_scale_max: 255    # fixed reference for log scaling (master uses 255)
  bias_sensitivity: low       
  flush_count: 32

DMD:
  A:
    usb_bus: 1
    usb_port: 2      # root-hub port; list for a hub chain, e.g. [2, 4]
    xrandr_output: DP-4    
  B:
    usb_bus: 1
    usb_port: 9
    xrandr_output: DP-0
  width: 1920
  height: 1080
  offset: [0, 0]
  target_hz: 60
  wake_dp: False
  safe_margin_us: 250.0
  min_exposure_us: 150
  frame_utilization: 1.0
  dual_pixel: False
  exposure_us: 16000
  display_pipeline_vsyncs: 5
  paired_startup_leader_vsyncs: 16  # non-semantic blank vsyncs after sequencer start; their triggers are skipped
  # constants
  dark_time_us: 0
  bitplanes: 24
  VID: 0x0451
  PID: 0xC900
  trigger_out:
    channel: TRIG_OUT_2
    source_dmd: A
    edge: rising
    pulse_width_us: 20
    rising_delay_us: 0
