log_level: INFO

Run:
  output_root: runs/camera2_master_30hz_blank
  count_start: 5
  count_end: 15                      # A shows count, blank, count, blank, ...
  number_size_px: 300
  test_b: dot                        # B-side static pattern: dot | checkerboard
  b_dot_x: 960
  b_dot_y: 540
  b_dot_radius: 30
  cycles: 20                        # count sequence is displayed this many times, then the run ends
  time_max_s: 600

Camera:
  ROI: # sensor silicon level; (0,0,1280,720) = full frame
    start_x: 0
    start_y: 0
    width: 1280
    height: 720
  Trigger:
    rising_edge: True
    falling_edge: False
  Filter:
    enable: False
    background_activity_duration: 2000
  Accumulation:
    window_us: 16000       # accumulation window == DMD exposure_us (master tied these)
    start_time_offset_us: 0
    polarity_mode: positive  # positive (ON events only) | signed (ON +1, OFF -1); signed shows the previous digit's late OFF events as a ghost
  width: 1280
  height: 720
  signal_fraction: 0.4
  normalize_scale_max: 255    # fixed reference for log scaling (master uses 255)
  bias_sensitivity: low
  Biases:             # Prophesee Gen4.1, absolute values; camera default and allowed range in comments
    bias_diff: 80     # 80, 52..100; reference for on/off, leave it
    bias_diff_on: 115 # 115, bias_diff+15..140; higher = fewer ON events
    bias_diff_off: 52 # 52, 25..bias_diff-15; lower = fewer OFF events
    bias_fo: 74       # 74, 45..110; higher = wider bandwidth (90 gave +11% signal, +20% noise, same timing)
    bias_hpf: 0       # 0, 0..120; higher = ignores slow light changes
    bias_refr: 68     # 68, 30..100; higher = shorter dead time after each event (85: no timing change)

DMD:
  A:
    usb_bus: 1
    usb_port: 2      # root-hub port; list for a hub chain, e.g. [2, 4]
    xrandr_output: DP-4    
  B:
    usb_bus: 1
    usb_port: 9
    xrandr_output: DP-0
  width: 1920
  height: 1080
  offset: [0, 0]
  target_hz: 60
  safe_margin_us: 250.0
  min_exposure_us: 150
  frame_utilization: 1.0
  dual_pixel: False
  exposure_us: 16000
  display_pipeline_vsyncs: 4        # triggers after the leader before the first semantic frame
  paired_startup_leader_vsyncs: 16  # non-semantic blank vsyncs after sequencer start; their triggers are skipped
  # constants
  dark_time_us: 0
  bitplanes: 24
  VID: 0x0451
  PID: 0xC900
  trigger_out:                      # A's TRIG_OUT_2 rising edge -> camera trigger input
    pulse_width_us: 20
    rising_delay_us: 0
