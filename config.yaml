log_level: DEBUG

Run:
  output_root: runs
  count_start: 5
  count_end: 15
  count_slots_per_frame: 1           # positive int, or 'auto' to fit the LUT budget
  count_blank_after_each_count: True # forces slots=1, doubles triggers per cycle
  number_size_px: 300
  test_b: dot                        # B-side static pattern: dot | checkerboard
  b_dot_x: 960
  b_dot_y: 540
  b_dot_radius: 30
  accumulation_cycles: 20
  runtime_seconds: 0                 # 0 = derive from accumulation_cycles
  save_filtered_events: True
  save_jpg: False
  time_max_s: 600

Camera:
  ROI:
    start_x: 0
    start_y: 0
    width: 346
    height: 260
  Trigger:
    rising_edge: True
    falling_edge: False
  Filter:
    enable: True
    background_activity_duration: 2000
  Accumulation:
    window_us: 16000       # accumulation window == DMD exposure_us (master tied these)
    start_time_offset_us: 0
    polarity_mode: positive # positive (ON events only) | signed (+1/-1) | ignore (all +1)
  width: 346
  height: 260
    
DMD:
  A:
    usb_bus: 1
    usb_port: 2      # root-hub port; list for a hub chain, e.g. [2, 4]
    xrandr_output: DP-2    
  B:
    usb_bus: 1
    usb_port: 8
    xrandr_output: DP-0
  width: 1920
  height: 1080
  offset: [0, 0]
  target_hz: 60
  wake_dp: False
  safe_margin_us: 250.0
  min_exposure_us: 150
  frame_utilization: 1.0
  dual_pixel: False
  exposure_us: 16000
  paired_startup_leader_vsyncs: 16  # non-semantic blank vsyncs after sequencer start; their triggers are skipped
  # constants
  dark_time_us: 0
  bitplanes: 24
  VID: 0x0451
  PID: 0xC900
  max_binary_rate_hz: 9523
  max_vsync_deviation_ratio: 0.25
  trigger_out:
    channel: TRIG_OUT_2
    source_dmd: A
    edge: rising
    pulse_width_us: 20
    rising_delay_us: 0
    delay_max_us: 20000
    delay_min_us: -20
  total_pixels_per_line: 1344
  total_lines_per_frame: 806
  active_pixels_per_line: 1024
  active_lines_per_frame: 768
  first_active_pixel: 160
  first_active_line: 35
  bottom_field_first_line: 1
  pixel_clock_khz: 65000
  paired_startup_leader_vsyncs: 16
  max_count_sequence_frames: 128